<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1A56DB">
  <meta name="description" content="Dienstplan und Anträge für Kita-Mitarbeitende">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kita-App">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="src/styles/main.css">
  <title>Kita-App</title>
</head>
<body>
  <div id="app">

    <div id="loading-overlay" class="loading-overlay" aria-live="polite" aria-label="Wird geladen">
      <div class="loading-spinner"></div>
      <p>Wird geladen…</p>
    </div>

    <main id="main-content" aria-label="Hauptinhalt">
      <section id="screen-home"      class="screen" hidden aria-label="Startseite"></section>
      <section id="screen-plan"      class="screen" hidden aria-label="Mein Dienstplan"></section>
      <section id="screen-antrag"    class="screen" hidden aria-label="Antrag stellen"></section>
      <section id="screen-antraege"  class="screen" hidden aria-label="Meine Anträge"></section>
      <section id="screen-infos"     class="screen" hidden aria-label="Mitteilungen"></section>
      <section id="screen-dashboard" class="screen" hidden aria-label="Dashboard"></section>
      <section id="screen-brett"     class="screen" hidden aria-label="Schwarzes Brett"></section>
    </main>

    <nav id="bottom-nav" class="bottom-nav" aria-label="Hauptnavigation">

      <button class="nav-item" data-screen="home" aria-label="Home">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span class="nav-label">Home</span>
      </button>

      <button class="nav-item" data-screen="plan" aria-label="Mein Plan">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <span class="nav-label">Plan</span>
      </button>

      <button class="nav-item" data-screen="antraege" aria-label="Meine Anträge">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="8" y1="6" x2="21" y2="6"/>
          <line x1="8" y1="12" x2="21" y2="12"/>
          <line x1="8" y1="18" x2="21" y2="18"/>
          <line x1="3" y1="6" x2="3.01" y2="6"/>
          <line x1="3" y1="12" x2="3.01" y2="12"/>
          <line x1="3" y1="18" x2="3.01" y2="18"/>
        </svg>
        <span class="nav-label">Anträge</span>
      </button>

      <button class="nav-item" data-screen="infos" aria-label="Mitteilungen">
        <span class="nav-icon-wrap">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 01-3.46 0"/>
          </svg>
          <span class="badge" id="notif-badge" hidden>0</span>
        </span>
        <span class="nav-label">Mitteilungen</span>
      </button>

      <button class="nav-item" id="nav-dashboard" data-screen="dashboard" aria-label="Dashboard" hidden>
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span class="nav-label">Dashboard</span>
      </button>

    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <button id="settings-btn" class="settings-btn" aria-label="Einstellungen" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round"
         width="22" height="22" aria-hidden="true">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83
               2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33
               1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4
               a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06
               A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09
               A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06
               a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51
               V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33
               l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9
               a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
    </svg>
  </button>

  <div id="sw-update-banner" class="sw-update-banner" hidden></div>
  <div id="ios-install-hint" class="ios-install-hint" hidden>
    <p>App installieren: Teilen-Symbol tippen, dann <strong>„Zum Home-Bildschirm"</strong></p>
    <button id="ios-install-close" aria-label="Hinweis schließen">&#x2715;</button>
  </div>

  <script type="module" src="src/app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
